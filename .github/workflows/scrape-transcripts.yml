name: Scrape TAL transcripts

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Overwrite existing transcript files"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Scrape transcripts
        run: |
          if [ "${{ github.event.inputs.overwrite }}" = "true" ]; then
            python scrape_tal_transcripts.py --output-dir transcripts --overwrite
          else
            python scrape_tal_transcripts.py --output-dir transcripts
          fi

      - name: Commit transcript files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add transcripts

          if git diff --cached --quiet; then
            echo "No transcript changes to commit."
          else
            git commit -m "Add TAL transcript scrape"
            git push
          fi
