name: Convert TAL transcripts to Markdown

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Overwrite existing Markdown files"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Convert transcripts to Markdown
        run: |
          if [ "${{ github.event.inputs.overwrite }}" = "true" ]; then
            python convert_transcripts_to_markdown.py \
              --input-dir transcripts \
              --output-dir markdown \
              --overwrite
          else
            python convert_transcripts_to_markdown.py \
              --input-dir transcripts \
              --output-dir markdown
          fi

      - name: Upload Markdown artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tal-markdown
          path: markdown

      - name: Commit Markdown files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add markdown

          if git diff --cached --quiet; then
            echo "No Markdown changes to commit."
          else
            git commit -m "Convert TAL transcripts to Markdown"
            git push
          fi
